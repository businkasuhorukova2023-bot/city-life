<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Pixel City V5.1</title>
    <meta name="theme-color" content="#0f172a">
    <link rel="apple-touch-icon" href="data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCAxOTIgMTkyIj48cmVjdCB3aWR0aD0iMTkyIiBoZWlnaHQ9IjE5MiIgcng9IjQwIiBmaWxsPSIjMGYxNzJhIi8+PHBvbHlnb24gcG9pbnRzPSI5Niw0MCAxNTAsOTAgNDIsOTAiIGZpbGw9IiNlZjQ0NDQiLz48cmVjdCB4PSI1MCIgeT0iOTAiIHdpZHRoPSI5MiIgaGVpZ2h0PSI2MCIgZmlsbD0iI2Y1OWUwYiIvPjxyZWN0IHg9IjgwIiB5PSIxMTAiIHdpZHRoPSIzMCIgaGVpZ2h0PSI0MCIgZmlsbD0iIzNlMjcyMyIvPjxyZWN0IHg9IjU1IiB5PSIxMDAiIHdpZHRoPSIyMCIgaGVpZ2h0PSIyMCIgZmlsbD0iI2ZlZjA4YSIvPjxyZWN0IHg9IjExNSIgeT0iMTAwIiB3aWR0aD0iMjAiIGhlaWdodD0iMjAiIGZpbGw9IiNmZWYwOGEiLz48L3N2Zz4=">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap');
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
        body { overflow: hidden; background: #000; touch-action: none; user-select: none; }
        canvas { display: block; width: 100vw; height: 100vh; }
        
        #ui {
            position: absolute; top: 10px; left: 10px; right: 10px;
            background: rgba(15, 23, 42, 0.85); color: white; padding: 10px 15px; border-radius: 15px;
            display: flex; justify-content: space-between; align-items: center;
            border: 1px solid rgba(255, 255, 255, 0.1); z-index: 10; flex-wrap: wrap; gap: 5px;
        }
        .stat { text-align: left; min-width: 60px; }
        .stat-name { font-size: 10px; color: #94a3b8; text-transform: uppercase; font-weight: 600;}
        .stat-val { font-size: 14px; font-weight: 800;}
        .bar-bg { width: 60px; height: 6px; background: rgba(255,255,255,0.1); border-radius: 10px; margin-top: 4px; overflow: hidden; }
        .bar-fill { height: 100%; border-radius: 10px; transition: 0.3s ease; }

        #task {
            position: absolute; top: 80px; left: 50%; transform: translateX(-50%);
            background: rgba(255, 255, 255, 0.95); color: #0f172a;
            padding: 10px 20px; border-radius: 20px; font-weight: 600; font-size: 13px;
            display: none; z-index: 10; text-align: center; width: 90%; max-width: 300px;
        }

        #btn-ai {
            position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%);
            background: #fff; color: #0f172a; border: none; padding: 15px 30px; border-radius: 30px;
            font-weight: 800; font-size: 14px; cursor: pointer; z-index: 10; box-shadow: 0 5px 15px rgba(0,0,0,0.3);
        }
        #btn-ai:active { transform: translateX(-50%) scale(0.95); }
        #btn-ai:disabled { opacity: 0.5; }
    </style>
</head>
<body>
    <div id="ui">
        <div class="stat"><div class="stat-name">Герой</div><div class="stat-val" id="ui-name">Никто</div></div>
        <div class="stat"><div class="stat-name">Здоровье</div><div class="bar-bg"><div id="ui-health" class="bar-fill" style="background:#10b981; width:100%;"></div></div></div>
        <div class="stat"><div class="stat-name">Голод</div><div class="bar-bg"><div id="ui-hunger" class="bar-fill" style="background:#f59e0b; width:100%;"></div></div></div>
        <div class="stat"><div class="stat-name">Порядок</div><div class="stat-val" id="ui-score" style="color:#38bdf8;">0</div></div>
    </div>

    <div id="task">...</div>
    <button id="btn-ai" onclick="generateTask()">✨ Новое задание</button>
    <canvas id="game"></canvas>

<script>
    var canvas = document.getElementById('game');
    var ctx = canvas.getContext('2d');
    
    function resize() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
    window.addEventListener('resize', resize); resize();

    var WORLD_WIDTH = 4500;
    var cameraX = 0, timeOfDay = 0, tick = 0, score = 0;

    // Все 9 персонажей
    var chars = [
        { name: "Дедушка", emoji: "👴", x: 300, tx: 300, hp: 100, food: 100, alive: true, type: 'family', speed: 1.2 },
        { name: "Бабушка", emoji: "👵", x: 350, tx: 350, hp: 100, food: 100, alive: true, type: 'family', speed: 1.2 },
        { name: "Папа", emoji: "👨", x: 450, tx: 450, hp: 100, food: 100, alive: true, type: 'family', speed: 2 },
        { name: "Мама", emoji: "👩", x: 500, tx: 500, hp: 100, food: 100, alive: true, type: 'family', speed: 2 },
        { name: "Сын", emoji: "👦", x: 550, tx: 550, hp: 100, food: 100, alive: true, type: 'family', speed: 2.5 },
        { name: "Дочь", emoji: "👧", x: 600, tx: 600, hp: 100, food: 100, alive: true, type: 'family', speed: 2.5 },
        { name: "Собачка", emoji: "🐕", x: 650, tx: 650, hp: 100, food: 100, alive: true, type: 'pet', speed: 3 },
        { name: "Кошечка", emoji: "🐈", x: 700, tx: 700, hp: 100, food: 100, alive: true, type: 'pet', speed: 3 },
        { name: "Коп", emoji: "👮‍♂️", x: 2000, tx: 2000, hp: 100, food: 100, alive: true, type: 'police', speed: 3.5 }
    ];
    var selected = null;

    var npcs = [
        { emoji: "🚶‍♂️", x: 1000, tx: 1200, speed: 1.5 },
        { emoji: "🚶‍♀️", x: 2800, tx: 2500, speed: 1.2 }
    ];

    var bandits = [];
    var banditTimer = 0;

    var houses = [
        { type: "home", x: 100, w: 200, h: 150, color: "#1e293b", roof: "#334155", name: "🏠 Дом" },
        { type: "shop", x: 1000, w: 200, h: 150, color: "#0f172a", roof: "#1e293b", name: "🏪 Магазин" },
        { type: "police", x: 1800, w: 220, h: 170, color: "#1e3a8a", roof: "#1e40af", name: "🚓 Участок" },
        { type: "hospital", x: 2600, w: 200, h: 160, color: "#f8fafc", roof: "#ef4444", name: "🏥 Больница" },
        { type: "garden", x: 3200, w: 200, h: 80, color: "#365314", roof: "#4d7c0f", name: "🌾 Огород" },
        { type: "graveyard", x: 4000, w: 250, h: 120, color: "#1f2937", roof: "#111827", name: "🪦 Кладбище" }
    ];

    var obstacles = [
        { type: "tree", x: 800 }, { type: "tree", x: 1400 }, { type: "tree", x: 2300 }, { type: "tree", x: 3500 },
        { type: "fence", x: 1250, w: 100 }
    ];

    var cars = [
        { x: 0, speed: 4, color: "#ef4444", dir: 1 },
        { x: 1500, speed: 3.5, color: "#3b82f6", dir: -1 },
        { x: 3000, speed: 5, color: "#f59e0b", dir: 1 }
    ];

    var stars = [];
    for(var i=0; i<60; i++) {
        stars.push({ x: Math.random(), y: Math.random()*0.6, s: Math.random()*1.5 });
    }

    function isDayTime() {
        return (timeOfDay > 0.25 && timeOfDay < 0.75);
    }

    function drawSky() {
        var top, bot;
        if (timeOfDay < 0.25) { var p=timeOfDay/0.25; top=lerp("#fca5a5","#7dd3fc",p); bot=lerp("#fdba74","#f0f9ff",p); }
        else if (timeOfDay < 0.5) { var p=(timeOfDay-0.25)/0.25; top=lerp("#7dd3fc","#1e1b4b",p); bot=lerp("#f0f9ff","#581c87",p); }
        else if (timeOfDay < 0.75) { var p=(timeOfDay-0.5)/0.25; top=lerp("#1e1b4b","#020617",p); bot=lerp("#581c87","#0f172a",p); }
        else { var p=(timeOfDay-0.75)/0.25; top=lerp("#020617","#fca5a5",p); bot=lerp("#0f172a","#fdba74",p); }
        
        var grad = ctx.createLinearGradient(0, 0, 0, canvas.height);
        grad.addColorStop(0, top); grad.addColorStop(1, bot);
        ctx.fillStyle = grad; ctx.fillRect(0, 0, canvas.width, canvas.height);

        var angle = timeOfDay * Math.PI * 2 - Math.PI/2;
        var sx = canvas.width/2 + Math.cos(angle)*(canvas.width/2.5);
        var sy = canvas.height/2 + Math.sin(angle)*(canvas.height/2.5);

        if (isDayTime()) {
            ctx.fillStyle = "#fef08a";
            ctx.beginPath(); ctx.arc(sx, sy, 40, 0, Math.PI*2); ctx.fill();
        } else {
            ctx.fillStyle = "rgba(255,255,255,0.8)";
            for(var i=0; i<stars.length; i++) {
                var star = stars[i];
                ctx.beginPath(); ctx.arc(star.x*canvas.width, star.y*canvas.height, star.s, 0, Math.PI*2); ctx.fill();
            }
            ctx.fillStyle = "#f1f5f9";
            ctx.beginPath(); ctx.arc(sx, sy, 30, 0, Math.PI*2); ctx.fill();
        }
    }

    function drawGround() {
        var gy = canvas.height * 0.75;
        var grass = ctx.createLinearGradient(0, gy, 0, canvas.height);
        grass.addColorStop(0, "#166534"); grass.addColorStop(1, "#052e16");
        ctx.fillStyle = grass; ctx.fillRect(0, gy, canvas.width, canvas.height - gy);

        // Дорога
        ctx.fillStyle = "#1e293b"; ctx.fillRect(0, gy - 60, canvas.width, 60);
        ctx.fillStyle = "#475569";
        for(var i = -cameraX % 100; i < canvas.width; i+=100) ctx.fillRect(i, gy - 32, 40, 4);

        // Машины
        for(var i=0; i<cars.length; i++) {
            var c = cars[i];
            c.x += c.speed * c.dir; 
            if(c.dir===1 && c.x>WORLD_WIDTH) c.x=-200; 
            if(c.dir===-1 && c.x<-200) c.x=WORLD_WIDTH;
            
            var s = c.x - cameraX; 
            if(s<-200 || s>canvas.width+200) continue;
            
            // Обычный прямоугольник (для совместимости)
            ctx.fillStyle = c.color; 
            ctx.fillRect(s, gy-45, 60, 25);
            
            ctx.fillStyle = "#000"; 
            ctx.beginPath(); ctx.arc(s+15, gy-20, 8, 0, Math.PI*2); ctx.fill(); 
            ctx.beginPath(); ctx.arc(s+45, gy-20, 8, 0, Math.PI*2); ctx.fill();
        }
    }

    function drawHouses() {
        var gy = canvas.height * 0.75;
        for(var i=0; i<houses.length; i++) {
            var h = houses[i];
            var s = h.x - cameraX; 
            if (s + h.w < -200 || s > canvas.width + 200) continue;
            
            ctx.fillStyle = h.color; ctx.fillRect(s, gy - h.h, h.w, h.h);
            ctx.fillStyle = h.roof; ctx.beginPath(); ctx.moveTo(s-20, gy-h.h); ctx.lineTo(s+h.w/2, gy-h.h-60); ctx.lineTo(s+h.w+20, gy-h.h); ctx.fill();
            
            if(h.type !== 'garden' && h.type !== 'graveyard') {
                ctx.fillStyle = "#020617"; ctx.fillRect(s + h.w/2 - 20, gy - 60, 40, 60);
                ctx.fillStyle = !isDayTime() ? "#38bdf8" : "#e2e8f0";
                ctx.fillRect(s + 30, gy - h.h + 40, 30, 30);
                ctx.fillRect(s + h.w - 60, gy - h.h + 40, 30, 30);
            }
            
            if (h.type === 'graveyard') {
                ctx.fillStyle = "#64748b";
                for(var j=0; j<5; j++) ctx.fillRect(s + 20 + j*40, gy - 40, 20, 40);
            }

            ctx.fillStyle = "#fff"; ctx.font = "bold 14px Inter"; ctx.textAlign = "center";
            ctx.fillText(h.name, s + h.w/2, gy - h.h - 70);
        }
    }

    function drawObstacles() {
        var gy = canvas.height * 0.75;
        for(var i=0; i<obstacles.length; i++) {
            var obs = obstacles[i];
            var s = obs.x - cameraX; 
            if(s < -100 || s > canvas.width + 100) continue;
            
            if (obs.type === "tree") {
                ctx.fillStyle = "#3e2723"; ctx.fillRect(s - 5, gy - 60, 10, 60);
                ctx.fillStyle = "#1b5e20"; ctx.beginPath(); ctx.arc(s, gy - 80, 35, 0, Math.PI * 2); ctx.fill();
            } else if (obs.type === "fence") {
                ctx.fillStyle = "#8D6E63";
                for (var j = 0; j < obs.w; j += 15) ctx.fillRect(s + j, gy - 40, 5, 40);
                ctx.fillRect(s, gy - 35, obs.w, 4); ctx.fillRect(s, gy - 20, obs.w, 4);
            }
        }
    }

    function drawEntities() {
        var gy = canvas.height * 0.75;

        // NPC
        for(var i=0; i<npcs.length; i++) {
            var n = npcs[i];
            n.x += Math.sign(n.tx - n.x) * n.speed;
            if(Math.abs(n.x - n.tx) < 5) n.tx = Math.random() * WORLD_WIDTH;
            var s = n.x - cameraX; 
            if(s<-50 || s>canvas.width+50) continue;
            ctx.font = "36px Arial"; ctx.textAlign="center"; ctx.textBaseline="bottom"; 
            ctx.fillText(n.emoji, s, gy - 5);
        }

        // Бандиты
        for(var i=0; i<bandits.length; i++) {
            var b = bandits[i];
            b.x += b.speed; if(b.x > WORLD_WIDTH) b.x = 0;
            var s = b.x - cameraX; 
            if(s<-50 || s>canvas.width+50) continue;
            ctx.font = "40px Arial"; ctx.textAlign="center"; ctx.textBaseline="bottom";
            ctx.fillStyle = "rgba(239, 68, 68, 0.3)"; ctx.beginPath(); ctx.arc(s, gy-20, 35, 0, Math.PI*2); ctx.fill();
            ctx.fillText(b.emoji, s, gy - 5);
        }

        // Игровые персонажи
        for(var i=0; i<chars.length; i++) {
            var c = chars[i];
            var s = c.x - cameraX; 
            
            if (!c.alive) {
                var graveyard = houses[5]; // 5-й индекс - кладбище
                var gs = (graveyard.x + 100) - cameraX; 
                if (gs > -100 && gs < canvas.width + 100) {
                    ctx.font = "24px Arial"; ctx.textAlign="center"; ctx.textBaseline="bottom";
                    ctx.fillText("👻", gs + (i * 15), gy - 40); 
                }
                continue;
            }

            if (s < -100 || s > canvas.width + 100) continue;
            var isMoving = Math.abs(c.x - c.tx) > 1;
            var bob = isMoving ? Math.sin(tick * 0.2) * 4 : 0;

            ctx.fillStyle = "rgba(0,0,0,0.4)"; ctx.beginPath(); ctx.ellipse(s, gy - 5, 20, 8, 0, 0, Math.PI*2); ctx.fill();
            ctx.font = "48px Arial"; ctx.textAlign = "center"; ctx.textBaseline = "bottom";
            ctx.fillText(c.emoji, s, gy - 10 + bob);

            if (c === selected) {
                ctx.strokeStyle = "#38bdf8"; ctx.lineWidth = 3; ctx.beginPath(); ctx.ellipse(s, gy - 5, 30, 15, 0, 0, Math.PI*2); ctx.stroke();
            }
        }
    }

    function update() {
        tick++; timeOfDay += 0.0003; if (timeOfDay > 1) timeOfDay = 0;
        var gy = canvas.height * 0.75;

        banditTimer++;
        if (banditTimer > 1500 && bandits.length < 2) {
            bandits.push({ emoji: "🦹‍♂️", x: Math.random() > 0.5 ? 0 : WORLD_WIDTH, speed: 1.5 });
            banditTimer = 0;
            showTask("Внимание! Замечен подозрительный тип.");
        }

        for(var i=0; i<chars.length; i++) {
            var c = chars[i];
            if (!c.alive) continue;
            
            var dx = c.tx - c.x;
            if (Math.abs(dx) > c.speed) c.x += Math.sign(dx) * c.speed; else c.x = c.tx;

            // Препятствия
            for(var j=0; j<obstacles.length; j++) {
                var obs = obstacles[j];
                if (obs.type === "tree" && Math.abs(c.x - obs.x) < 20) c.x = obs.x + (c.x > obs.x ? 25 : -25);
                if (obs.type === "fence" && c.x > obs.x - 10 && c.x < obs.x + obs.w + 10) c.x = obs.x + (c.x > obs.x + obs.w/2 ? obs.w + 15 : -15);
            }

            if (Math.random() < 0.001) c.food = Math.max(0, c.food - 0.5);

            // Машины сбивают! (если персонаж на дороге)
            for(var j=0; j<cars.length; j++) {
                var car = cars[j];
                // Если персонаж близко к дороге и машина близко
                if (Math.abs(c.x - car.x) < 30 && c.x > car.x - 60 && c.x < car.x + 60) {
                    c.hp -= 0.5; // Медленно теряет здоровье под колесами
                    if(c.hp > 0) showTask("🚨 " + c.name + " попал под колеса!");
                }
            }

            // Магазин, огород, больница
            if (c.x === c.tx) {
                if (Math.abs(c.x - 1100) < 60 && c.food < 100) { c.food = 100; showTask(c.name + " покушал."); }
                if (Math.abs(c.x - 3300) < 60 && c.food < 100) { c.food = 100; showTask(c.name + " собрал урожай."); }
                if (Math.abs(c.x - 2700) < 60 && c.hp < 100) { c.hp = 100; showTask(c.name + " подлечился."); }
            }

            if (c.food <= 0) c.hp = Math.max(0, c.hp - 0.1);
            
            if (c.hp <= 0) { 
                c.alive = false; 
                if (selected === c) { selected = null; updateUI(); } 
                showTask("💀 " + c.name + " ушел на кладбище...");
            }
        }

        if (selected) {
            var targetCam = selected.x - canvas.width / 2;
            cameraX += (targetCam - cameraX) * 0.08;
            cameraX = Math.max(0, Math.min(cameraX, WORLD_WIDTH - canvas.width));
        }
    }

    canvas.addEventListener('click', function(e) {
        var rect = canvas.getBoundingClientRect();
        var clickX = e.clientX - rect.left + cameraX;
        var gy = canvas.height * 0.75;

        // Клик по бандиту
        var clickedBandit = null;
        for(var i=0; i<bandits.length; i++) {
            var b = bandits[i];
            var s = b.x - cameraX;
            var dist = Math.sqrt(Math.pow(e.clientX - rect.left - s, 2) + Math.pow(e.clientY - rect.top - (gy - 20), 2));
            if (dist < 40) clickedBandit = i;
        }

        if (clickedBandit !== null && selected && selected.type === 'police') {
            bandits.splice(clickedBandit, 1);
            score += 10;
            document.getElementById('ui-score').innerText = score;
            showTask("Нарушитель задержан.");
            return;
        }

        // Клик по своим
        var clicked = null;
        for(var i=0; i<chars.length; i++) {
            var c = chars[i];
            if (!c.alive) continue;
            var s = c.x - cameraX;
            if (Math.sqrt(Math.pow(e.clientX - rect.left - s, 2) + Math.pow(e.clientY - rect.top - (gy - 20), 2)) < 40) clicked = c;
        }

        if (clicked) { selected = clicked; updateUI(); }
        else if (selected) { selected.tx = Math.max(0, Math.min(clickX, WORLD_WIDTH)); }
    });

    function updateUI() {
        var n = document.getElementById('ui-name'), h = document.getElementById('ui-health'), f = document.getElementById('ui-hunger');
        if (selected) {
            n.innerText = selected.name; 
            h.style.width = selected.hp + "%"; f.style.width = selected.food + "%";
            h.style.background = selected.hp > 50 ? "#10b981" : "#ef4444";
            f.style.background = selected.food > 50 ? "#f59e0b" : "#ef4444";
        } else {
            n.innerText = "Никто"; h.style.width = "100%"; f.style.width = "100%";
        }
    }

    function showTask(text) {
        var b = document.getElementById('task'); b.innerText = text; b.style.display = 'block';
        clearTimeout(window.tt); window.tt = setTimeout(function(){ b.style.display = 'none'; }, 3000);
    }

    async function generateTask() {
        var btn = document.getElementById('btn-ai'); btn.disabled = true; btn.innerText = "Анализ...";
        var alive = chars.filter(function(c) { return c.alive; });
        if (alive.length === 0) {
            showTask("Все ушли на кладбище..."); btn.disabled = false; btn.innerText = "✨ Новое задание"; return;
        }
        var target = alive[Math.floor(Math.random() * alive.length)];
        var context = bandits.length > 0 ? "На улице преступник." : "В городе спокойно.";
        var prompt = "Придумай короткую (до 6 слов) задачу для персонажа " + target.name + ". Контекст: " + context + ". Пример: 'хочет пить'. Без кавычек.";
        
        try {
            var res = await fetch("https://text.pollinations.ai/" + encodeURIComponent(prompt));
            var t = await res.text(); t = t.replace(/[0-9"{}[\]]/g, '').trim();
            if(t.length < 5) t = "отдыхает";
            showTask(target.name + " " + t.toLowerCase());
        } catch(e) { showTask(target.name + " отдыхает"); } 
        finally { btn.disabled = false; btn.innerText = "✨ Новое задание"; }
    }

    function lerp(a, b, amt) {
        var ah=parseInt(a.replace('#',''),16), ar=ah>>16, ag=ah>>8&0xff, ab=ah&0xff;
        var bh=parseInt(b.replace('#',''),16), br=bh>>16, bg=bh>>8&0xff, bb=bh&0xff;
        return 'rgb('+(((br-ar)*amt)+ar|0)+','+(((bg-ag)*amt)+ag|0)+','+(((bb-ab)*amt)+ab|0)+')';
    }

    function loop() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        drawSky(); drawGround(); drawHouses(); drawObstacles(); drawEntities(); update();
        requestAnimationFrame(loop);
    }
    loop();
</script>
</body>
</html>
